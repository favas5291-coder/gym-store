name: iPhone app
on:
  pull_request:
    paths: ['ios/**', 'capacitor.config.json', '.env.ios', 'src/**', 'scripts/**', 'public/**', 'tests/**', 'package*.json', 'index.html', 'vercel.json', 'vite.config.js', '.github/workflows/ios-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select live Safari evidence for branding changes
        id: live_safari
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # PR checkout is the merge ref. Its first parent is the base.
            changes=$(git diff --name-only HEAD^1 HEAD -- index.html vercel.json 'public/favicon*' 'public/brand/**' 'public/apple-touch-icon*' 'public/android-chrome-*' public/site.webmanifest public/robots.txt 'scripts/*favicon*' scripts/verify-live-safari.py .github/workflows/ios-app.yml)
            if [ -n "$changes" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select a stable Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          choices = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              match = re.fullmatch(r'Xcode_(\d+)\.(\d+)(?:\.(\d+))?\.app', app.name)
              if match and int(match[1]) >= 26:
                  choices.append((tuple(int(value or 0) for value in match.groups()), app))
          if not choices:
              raise SystemExit('A stable Xcode 26+ is required; no supported toolchain installed.')
          subprocess.run(['sudo', 'xcode-select', '-s', str(max(choices)[1] / 'Contents/Developer')], check=True)
          PY
          xcodebuild -version
          xcodebuild -showsdks
      - run: npm ci
      - run: npm run doctor && npm test
      - run: npm run ios:sync
      - name: Compile unsigned application and UI test runner before booting the simulator
        id: compile
        run: |
          set -o pipefail
          mkdir -p test-results/ios
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee test-results/ios/build.log
      - name: Prepare iPhone simulator for native launch and navigation tests
        id: simulator_ready
        timeout-minutes: 14
        run: |
          python3 scripts/smoke-ios.py --prepare-only
      - name: Native iPhone shopping tab tests
        timeout-minutes: 10
        run: python3 scripts/test-ios-ui.py
      - name: Capture live HTTPS and Safari evidence on this Mac and iPhone
        if: "!cancelled() && steps.simulator_ready.outcome == 'success' && steps.live_safari.outputs.run == 'true'"
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/verify-live-safari.py
      - name: Package simulator build (requires a Mac; not installable on a physical iPhone)
        if: always() && steps.compile.outcome == 'success'
        run: |
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app test-results/ios/GymDrobe-iPhone-Simulator.zip
          shasum -a 256 test-results/ios/GymDrobe-iPhone-Simulator.zip > test-results/ios/SHA256SUMS.txt
      - name: Compile the opt-in push bridge without registering or sending
        env:
          VITE_PUSH_ENABLED: 'true'
          VITE_APNS_ENVIRONMENT: sandbox
        run: |
          npm run ios:sync
          set -o pipefail
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedDataPush CODE_SIGNING_ALLOWED=NO build 2>&1 | tee test-results/ios/push-bridge-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GymDrobe-iPhone-Simulator
          path: test-results/ios/
          retention-days: 30
