name: Android app
on:
  pull_request:
    paths: ['android/**', 'capacitor.config.json', '.env.android', 'src/**', 'scripts/**', 'public/**', 'tests/**', 'package*.json', 'index.html', 'vite.config.js', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run doctor && npm test
      - name: Build and sync bundled Android storefront
        run: npm run android:sync
      - name: Compile Android test APK and verify signing certificate
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug signingReport
      - name: Collect Android test build
        run: |
          mkdir -p test-results/android
          cp android/app/build/outputs/apk/debug/app-debug.apk test-results/android/GymDrobe-debug.apk
          keytool -list -v -keystore android/debug.keystore -storepass android -alias androiddebugkey > test-results/android/signing-certificate.txt
          sha256sum test-results/android/GymDrobe-debug.apk > test-results/android/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the Android APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r test-results/android/GymDrobe-debug.apk
            adb logcat -c
            adb shell am start -W -n com.gymdrobe.app/.MainActivity
            sleep 8
            adb shell am start -W -a android.intent.action.VIEW -d 'gymdrobe://app/login' com.gymdrobe.app
            sleep 8
            adb shell uiautomator dump /sdcard/gymdrobe-window.xml
            adb pull /sdcard/gymdrobe-window.xml test-results/android/login-screen.xml
            grep -q 'Continue with Google' test-results/android/login-screen.xml
            adb shell pidof com.gymdrobe.app
            adb exec-out screencap -p > test-results/android/login-screen.png
            adb logcat -d -s AndroidRuntime:E > test-results/android/android-runtime.log
            if grep -q 'com.gymdrobe.app' test-results/android/android-runtime.log; then cat test-results/android/android-runtime.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GymDrobe-Android-debug
          path: test-results/android/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
