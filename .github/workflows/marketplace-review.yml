name: Supplier marketplace browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketplace-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  marketplace-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: favas5291-coder/gym-drobe-backend
          ref: 1fd0278211192fece5cf805ca447f0a4630bfad8
          path: .qa-marketplace-backend
      - run: npm ci --prefix .qa-marketplace-backend
      - name: Isolated browser tooling
        timeout-minutes: 7
        env:
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '60000'
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          mkdir -p test-results/marketplace
          set -o pipefail
          # The hosted runner's Azure Ubuntu mirror can stall package downloads.
          # Use Ubuntu's official archive; signed package verification stays enabled.
          sudo python3 - <<'PYMIRROR'
          from pathlib import Path
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt').glob('*mirrors*.txt')]
          for path in paths:
              if not path.exists():
                  continue
              original = path.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
              if updated != original:
                  path.write_text(updated)
                  print('Using official Ubuntu archive:', path)
          Path('/etc/apt/apt.conf.d/99gymdrobe-ci').write_text('Acquire::Retries "1";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n')
          PYMIRROR
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false playwright@1.62.1 2>&1 | tee test-results/marketplace/tooling.log
          npx playwright install --with-deps chromium webkit 2>&1 | tee -a test-results/marketplace/tooling.log
      - name: Start disposable replica set
        run: |
          docker run --detach --name gymdrobe-marketplace-browser -p 127.0.0.1:27018:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec gymdrobe-marketplace-browser mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec gymdrobe-marketplace-browser mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          docker exec gymdrobe-marketplace-browser mongosh --quiet --eval 'for(let i=0;i<60;i++){if(db.hello().isWritablePrimary)quit(0);sleep(500)}quit(1)'
      - name: Real dashboards, JWT APIs and database with synthetic payment boundary
        env:
          GYMDROBE_TEST_MONGO_URI: mongodb://127.0.0.1:27018/gymdrobe_fixture_marketplace_browser_ci?replicaSet=rs0&directConnection=true
          GYMDROBE_MARKETPLACE_BACKEND_DIR: .qa-marketplace-backend
          GYMDROBE_MARKETPLACE_BACKEND_SHA: 1fd0278211192fece5cf805ca447f0a4630bfad8
        run: node tests/marketplace-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-browser-review
          path: test-results/marketplace/
          retention-days: 14
      - name: Stop disposable database
        if: always()
        run: |
          docker logs gymdrobe-marketplace-browser || true
          docker rm --force gymdrobe-marketplace-browser || true
