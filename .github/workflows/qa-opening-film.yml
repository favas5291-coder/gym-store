name: Mobile opening film
on:
  push:
    branches: [qa-opening-film-20261119]
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: af16ffbe926af9894dde0062c4de0c4b2761e6a1
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact revision for the mobile opening check
        working-directory: candidate
        env:
          VITE_SITE_URL: https://www.gymdrobe.com
          VITE_API_URL: https://gym-drobe-backend.onrender.com/api
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install test client
        run: |
          cd /tmp
          npm install --no-audit --no-fund playwright@1.55.0
      - name: Record opening in WebKit
        env:
          PHASE: candidate
          BUILD_DIR: candidate/dist
        run: |
          cp .github/film/journey.mjs /tmp/film-journey.mjs
          node /tmp/film-journey.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-opening-films
          path: film/
