name: Read-only live tile captures
on:
  push:
    branches: ['qa/live-shopping-tile-reference-20261119']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 297fcd559578f5d35673c27c7f9a88165d47f80d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev && npm run build
        env:
          VITE_SITE_URL: https://www.gymdrobe.com
          VITE_API_URL: https://gym-drobe-backend.onrender.com/api
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false playwright-core@1.61.1
      - name: Capture production sites and log CSS pixel measurements
        shell: bash
        run: |
          cat > capture.mjs <<'ENDJS'
          import {chromium} from 'playwright-core';
          import {mkdir, writeFile} from 'node:fs/promises';
          const out='live-visual-evidence';
          await mkdir(out,{recursive:true});
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const results=[];
          const {stat}=await import('node:fs/promises');
          const {resolve,sep}=await import('node:path');
          const dist=resolve('dist');
          console.log('PR_BUILD 297fcd559578f5d35673c27c7f9a88165d47f80d served via isolated browser fixture on public asset origin; public data/images untouched');
          for(const [label,url] of [['gymdrobe','https://www.gymdrobe.com/']]) {
           for(const [width,height] of [[390,844],[360,800],[1440,900],[2048,1152]]) {
            const tag=label+'-'+width;
            const context=await browser.newContext({viewport:{width,height},serviceWorkers:"block",deviceScaleFactor:1,isMobile:width<500,hasTouch:width<500,locale:'en-GB',reducedMotion:'reduce'});
            await context.route('https://www.gymdrobe.com/**',async route=>{
              const u=new URL(route.request().url());
              if(route.request().method()!=='GET')return route.abort();
              const p=resolve(dist,'.'+(u.pathname==='/'?'/index.html':decodeURIComponent(u.pathname)));
              if(!p.startsWith(dist+sep))return route.abort();
              if ((await stat(p).catch(()=>null))?.isFile()) return route.fulfill({path:p});
              await route.continue();
            });
            const page=await context.newPage();
            try {
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForTimeout(7000);
              // Dismiss only optional consent dialogs with an explicit rejection control.
              const reject=page.getByRole('button',{name:/^(reject all|decline all|reject optional cookies|accept only essential cookies|only necessary cookies)$/i}).first();
              if(await reject.isVisible().catch(()=>false)) await reject.click({timeout:2000}).catch(()=>{});
              for(let y=0;y<4500;y+=550){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(200);}
              await page.evaluate(()=>scrollTo(0,0));
              console.log('FONTS',tag,JSON.stringify(await page.evaluate(()=>[...document.fonts].filter(f=>f.status==='loaded').map(f=>[f.family,f.weight])))); const headings=await page.locator('h1,h2,h3,[role=heading]').evaluateAll(es=>es.map(e=>e.textContent.trim()).filter(Boolean).slice(0,80));
              console.log('HEADINGS',tag,response?.status(),JSON.stringify(headings).slice(0,3000));
              if(label==='gymshark'){
                const title=page.getByText('ARE YOU IN THE RIGHT PLACE?',{exact:true}).first();
                if(await title.isVisible().catch(()=>false)){
                  const outer=title.locator("xpath=ancestor::*[.//button or .//a][1]");
                  const parent=outer.locator("..");
                  const details=await parent.evaluate(e=>({text:e.innerText.slice(0,1200),buttons:[...e.querySelectorAll("button,a")].map(b=>[b.tagName,b.innerText,b.ariaLabel])})).catch(()=>null);
                  console.log('LOCATION_UI',tag,JSON.stringify(details));
                  const dismiss=parent.getByRole("button",{name:/^ROW$|close|dismiss|stay|continue to (this|rest)|no, thanks/i}).first();
                  if(await dismiss.isVisible().catch(()=>false)) await dismiss.click().catch(()=>{});
                  if(await title.isVisible().catch(()=>false))await page.keyboard.press('Escape');
                  if(await title.isVisible().catch(()=>false)){
                    const close=page.locator('[role="dialog"] button[aria-label*="close" i], [data-testid*="close" i]').filter({visible:true}).first();
                    if(await close.isVisible().catch(()=>false))await close.click({timeout:1500}).catch(()=>{});
                  }
                }
              }
              const select=label==='gymdrobe'?[/women.s workout gear/i,/^featured gear$/i]:[/women.s sale|shop by category|women.s.*categor/i,/softsense|best of sale|bestsellers|best sellers|new releases/i];
              for(let n=0;n<2;n++){
                const selected=headings.find(x=>select[n].test(x));
                const rec={tag,section:n,url:page.url(),status:response?.status(),heading:selected||null};
                if(!selected){rec.observedHeadings=headings.slice(0,18);results.push(rec);continue;}
                const heading=page.getByRole('heading',{name:selected,exact:true}).first();
                await heading.evaluate(e=>{e.scrollIntoView({block:'start'});window.scrollBy({top:-120,behavior:'instant'});});
                await page.waitForTimeout(1300);
                rec.blocks=await heading.evaluate(el=>{
                  const box=e=>{const b=e.getBoundingClientRect();return [b.x,b.y,b.width,b.height].map(n=>Math.round(n*10)/10);};
                  let node=el.parentElement;
                  while(node.parentElement && node.querySelectorAll('img').length<2)node=node.parentElement;
                  const imgs=[...node.querySelectorAll('img')].filter(e=>e.getBoundingClientRect().width>45).slice(0,8);
                  const pic=imgs[0], y=pic?.getBoundingClientRect().bottom??0; const captions=[...node.querySelectorAll('h3,h4,a,span,p,strong')].filter(e=>{ const b=e.getBoundingClientRect();return b.height>7&&b.height<65&&b.top>=y-1&&b.left>=0&&e.childElementCount===0&&e.textContent.trim() }).slice(0,4).map(e=>({text:e.textContent.trim().slice(0,60),box:box(e),font:getComputedStyle(e).font})); return {captions,heading:box(el),headingFont:getComputedStyle(el).font,section:box(node),images:imgs.map(e=>({alt:e.alt,rect:box(e),parent:box(e.parentElement),fit:getComputedStyle(e).objectFit,pos:getComputedStyle(e).objectPosition,natural:[e.naturalWidth,e.naturalHeight],source:e.currentSrc?.slice(0,300),crop:new URL(e.currentSrc||e.src,location.href).search.slice(0,130)}))};
                });
                const shot=out+'/'+tag+'-'+n+'.png'; await page.screenshot({path:shot,animations:'disabled'});if(rec.blocks.heading[1]>height||rec.blocks.heading[1]<0){const crop=await heading.evaluateHandle(e=>{let p=e.parentElement;while(p.parentElement&&p.querySelectorAll('img').length<2)p=p.parentElement;return p;});await crop.asElement().screenshot({path:out+'/'+tag+'-'+n+'-element.png',animations:'disabled',timeout:5000}).catch(()=>{});}results.push(rec);
                console.log('GEOMETRY',JSON.stringify(rec).slice(0,4000));
              }
              if(!results.some(x=>x.tag===tag && x.heading)) await page.screenshot({path:out+'/'+tag+'-observed.png',animations:'disabled'});
            }catch(e){console.log('CAPTURE_ERROR',tag,e.message);results.push({tag,error:e.message});}
            finally{await context.close();}
           }
          }
          await writeFile(out+'/metrics.json',JSON.stringify(results,null,2));
          await browser.close();
          ENDJS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-shopping-reference
          path: live-visual-evidence/
          retention-days: 7
