name: Read-only live tile captures
on:
  push:
    branches: ['qa/live-shopping-tile-reference-20261119']
permissions:
  contents: read
jobs:
  public-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund playwright-core@1.61.1
      - name: Verify live storefront
        run: |
          cat > verify.mjs <<'ENDJS'
          import {chromium} from 'playwright-core';
          import {mkdir,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const results=[],out='production-gear';
          await mkdir(out,{recursive:true});
          try{
          for(const [width,height] of [[390,844],[360,800],[1440,900],[2048,1152]]) {
           const ctx=await browser.newContext({viewport:{width,height},isMobile:width<700,hasTouch:width<700,deviceScaleFactor:1,serviceWorkers:'block',reducedMotion:'reduce'});
           await ctx.route('**/*',r=>['GET','HEAD','OPTIONS'].includes(r.request().method())?r.continue():r.abort());
           const page=await ctx.newPage();
           const res=await page.goto('https://www.gymdrobe.com/',{waitUntil:'domcontentloaded',timeout:40000});assert.equal(res?.status(),200);
           if(width===390) { await page.waitForTimeout(6500); } const info={width,height,url:page.url(),status:res.status(),sections:{}};
           for(const [name,selector] of [['category','#categories .athletic-category-grid > a'],['featured','#featured .gm-product-image']]){
            const links=page.locator(selector);await links.first().waitFor({timeout:30000});
            const heading=page.locator(name==='category'?'#categories h2':'#featured h2').first();
            await heading.evaluate(e=>window.scrollTo({top:e.getBoundingClientRect().top+scrollY-100,behavior:'instant'}));
            await page.waitForTimeout(850);
            const rects=await links.evaluateAll(nodes=>nodes.map(e=>{const r=e.getBoundingClientRect();return [Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)];}));
            const row=rects.map((b,i)=>({b,i})).filter(({b})=>b[2]>1&&b[0]>=-0.5&&b[0]+b[2]<=width+1&&Math.abs(b[1]-rects[0][1])<2);
            assert.equal(row.length,width<700?2:name==='category'?4:5,'first row count '+width+name);
            const samples=[];
            for (const {i} of row) {
              const link=links.nth(i);const image=link.locator('img').first();
              await image.evaluate(el=>Promise.race([el.decode(),new Promise((_,reject)=>setTimeout(()=>reject(Error('decode timeout')),8000))]));
              const photo=await image.evaluate(el=>({src:el.currentSrc,natural:[el.naturalWidth,el.naturalHeight]}));const href=await link.getAttribute('href');
              assert.ok(photo.natural.every(n=>n>0));assert.ok(href.startsWith(name==='category'?'/shop?':'/product/')); samples.push({href,...photo});
            }
            assert.ok(samples.slice(0,2).every(v=>v.src.startsWith('https://www.gymdrobe.com/media/home-gear/')));
            await page.screenshot({path:out+'/'+name+'-'+width+'.png'});
            info.sections[name]={visibleCount:row.length,compareRows:rects.slice(0,6),samples};
           }
           if(width===390||width===1440){
             for(const [key,selector] of [['category','#categories .athletic-category-grid > a'],['featured','#featured .gm-product-image']]){
               const link=page.locator(selector).first();const href=await link.getAttribute('href');
               await link.click({timeout:10000});await page.waitForURL(u=>u.pathname===new URL(href,'https://www.gymdrobe.com/').pathname,{timeout:9000});
               await page.waitForTimeout(1500);
               const title=await page.locator('main h1,main h2').allTextContents().catch(()=>[]);
               info.sections[key].destination={url:page.url(),headings:title.slice(0,5)};
               await page.goBack({waitUntil:'domcontentloaded'});await page.locator('#featured .gm-product-image').first().waitFor({timeout:16000});
             }
           }
           console.log('LIVE_VERIFIED',JSON.stringify(info));results.push(info);await ctx.close();
          }
          }finally{await writeFile(out+'/production.json',JSON.stringify(results,null,2));await browser.close();}
          
          ENDJS
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-shopping-gear
          path: production-gear/
          retention-days: 7
