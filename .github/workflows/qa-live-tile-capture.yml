name: Read-only live tile captures
on:
  push:
    branches: ['qa/live-shopping-tile-reference-20261119']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund playwright-core@1.61.1
      - name: Capture production sites and log CSS pixel measurements
        shell: bash
        run: |
          cat > capture.mjs <<'ENDJS'
          import {chromium} from 'playwright-core';
          import {mkdir, writeFile} from 'node:fs/promises';
          const out='live-visual-evidence';
          await mkdir(out,{recursive:true});
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const results=[];
          for(const [label,url] of [['gymdrobe','https://www.gymdrobe.com/'],['gymshark','https://row.gymshark.com/']]) {
           for(const [width,height] of [[390,844],[360,800],[1440,900]]) {
            const tag=label+'-'+width;
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,isMobile:width<500,hasTouch:width<500,locale:'en-GB',reducedMotion:'reduce'});
            const page=await context.newPage();
            try {
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForTimeout(6800);
              // Dismiss only optional consent dialogs with an explicit rejection control.
              const reject=page.getByRole('button',{name:/^(reject all|decline all|reject optional cookies|only necessary cookies)$/i}).first();
              if(await reject.isVisible().catch(()=>false)) await reject.click({timeout:2000}).catch(()=>{});
              for(let y=0;y<4500;y+=550){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(200);}
              await page.evaluate(()=>scrollTo(0,0));
              const headings=await page.locator('h1,h2,h3,[role=heading]').evaluateAll(es=>es.map(e=>e.textContent.trim()).filter(Boolean).slice(0,80));
              console.log('HEADINGS',tag,response?.status(),JSON.stringify(headings).slice(0,3000));
              const select=label==='gymdrobe'?[/women.s workout gear/i,/^featured gear$/i]:[/women.s sale|shop by category|women.s.*categor/i,/softsense|best of sale|bestsellers|best sellers|new releases/i];
              for(let n=0;n<2;n++){
                const selected=headings.find(x=>select[n].test(x));
                const rec={tag,section:n,url:page.url(),status:response?.status(),heading:selected||null};
                if(!selected){rec.observedHeadings=headings.slice(0,18);results.push(rec);continue;}
                const heading=page.getByRole('heading',{name:selected,exact:true}).first();
                await heading.evaluate(e=>{e.scrollIntoView({block:'start'});window.scrollBy(0,-120);});
                await page.waitForTimeout(1000);
                rec.blocks=await heading.evaluate(el=>{
                  const box=e=>{const b=e.getBoundingClientRect();return [b.x,b.y,b.width,b.height].map(n=>Math.round(n*10)/10);};
                  let node=el.parentElement;
                  while(node.parentElement && node.querySelectorAll('img').length<2)node=node.parentElement;
                  const imgs=[...node.querySelectorAll('img')].filter(e=>e.getBoundingClientRect().width>45).slice(0,8);
                  return {heading:box(el),headingFont:getComputedStyle(el).font,section:box(node),images:imgs.map(e=>({alt:e.alt,rect:box(e),parent:box(e.parentElement),fit:getComputedStyle(e).objectFit,pos:getComputedStyle(e).objectPosition,natural:[e.naturalWidth,e.naturalHeight],crop:new URL(e.currentSrc||e.src,location.href).search.slice(0,130)}))};
                });
                await page.screenshot({path:out+'/'+tag+'-'+n+'.png',animations:'disabled'});results.push(rec);
                console.log('GEOMETRY',JSON.stringify(rec).slice(0,4000));
              }
              if(!results.some(x=>x.tag===tag && x.heading)) await page.screenshot({path:out+'/'+tag+'-observed.png',animations:'disabled'});
            }catch(e){console.log('CAPTURE_ERROR',tag,e.message);results.push({tag,error:e.message});}
            finally{await context.close();}
           }
          }
          await writeFile(out+'/metrics.json',JSON.stringify(results,null,2));
          await browser.close();
          ENDJS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-shopping-reference
          path: live-visual-evidence/
          retention-days: 7
