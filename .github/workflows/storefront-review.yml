name: Storefront review
on:
  pull_request:
    paths: ['index.html', 'src/**', 'public/**', 'tests/**', 'package*.json', '.github/workflows/storefront-review.yml']
concurrency:
  group: storefront-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build production application and catalog sitemap
        env:
          VITE_API_URL: https://gym-drobe-backend.onrender.com/api
          VITE_SITE_URL: https://www.gymdrobe.com
        run: npm run build
      - name: Verify cinematic MP4 encoding, copied assets and production HTTP range support
        run: node scripts/verify-cinematic-media.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Storefront interactions and responsive screenshots
        run: npm run test:storefront
      - name: Production preview LCP and CLS lab samples
        if: always()
        run: node tests/storefront-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-review
          path: test-results/storefront
          retention-days: 14
