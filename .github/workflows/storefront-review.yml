name: Storefront review
on:
  push:
    branches: [feature/cinematic-storefront]
    paths: ['index.html', 'src/**', 'public/**', 'tests/**', 'package*.json', '.github/workflows/storefront-review.yml']
  pull_request:
    paths: ['index.html', 'src/**', 'public/**', 'tests/**', 'package*.json', '.github/workflows/storefront-review.yml']
concurrency:
  group: storefront-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Compile production application (sitemap needs production API)
        run: npx --no-install vite build
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Storefront interactions and responsive screenshots
        run: npm run test:storefront
      - name: Production preview LCP and CLS lab samples
        if: always()
        run: node tests/storefront-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-review
          path: test-results/storefront
          retention-days: 14
