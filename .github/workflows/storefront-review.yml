name: Storefront review
on:
  pull_request:
    paths: ['index.html', 'src/**', 'scripts/**', 'vercel.json', 'public/**', 'tests/**', 'package*.json', '.github/workflows/storefront-review.yml']
concurrency:
  group: storefront-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build production application and catalog sitemap
        env:
          VITE_API_URL: https://gym-drobe-backend.onrender.com/api
          VITE_SITE_URL: https://www.gymdrobe.com
        run: npm run build
      - name: Verify transparent favicon assets in Vite dist
        run: node scripts/verify-favicon-build.mjs
      - name: Verify built product HTML metadata and canonical aliases
        run: node scripts/verify-storefront-documents.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Checkout the paired shopping API contract fixture
        uses: actions/checkout@v4
        with:
          repository: favas5291-coder/gym-drobe-backend
          ref: 651aee066db8a85e06b692527829ffed167c89ac
          path: .qa-shopping-backend
      - name: Install isolated shopping API test dependencies
        run: npm ci --ignore-scripts --prefix .qa-shopping-backend
      - name: Shared shopping lists through React and the actual API contract
        env:
          GYMDROBE_SHOPPING_BACKEND_DIR: .qa-shopping-backend
        run: node tests/shopping-sync-browser.mjs
      - name: Opt-in native order notification UI and actual JWT API contract
        env:
          GYMDROBE_SHOPPING_BACKEND_DIR: .qa-shopping-backend
        run: node tests/order-push-browser.mjs
      - name: Shared navigation and photo-search UX contracts
        run: node tests/photo-search-browser.mjs
      - name: Account dashboard before and after, responsive and account regression checks
        run: |
          node tests/account-dashboard-browser.mjs --before
          node tests/account-dashboard-browser.mjs
      - name: Mobile saved-session recovery checks
        run: node tests/mobile-session-browser.mjs
      - name: Free mobile navigation and hidden photo-search checks
        run: node tests/free-navigation-browser.mjs
      - name: Storefront interactions and responsive screenshots
        run: npm run test:storefront
      - name: PWA install, offline recovery and update checks
        run: node tests/pwa-browser.mjs
      - name: Android UI and native-adapter contracts
        run: node tests/native-browser.mjs
      - name: iPhone WebKit navigation, Apple adapter and secure-session contracts
        run: node tests/ios-browser.mjs
      - name: Production preview LCP and CLS lab samples
        if: always()
        run: node tests/storefront-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-shopping-review
          path: test-results/shopping-sync/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-notification-review
          path: test-results/notifications/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-review
          path: test-results/storefront
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-review
          path: test-results/pwa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-browser-review
          path: test-results/ios-browser/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-search-review
          path: test-results/photo-search/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-dashboard-review
          path: test-results/account-dashboard
          retention-days: 14
