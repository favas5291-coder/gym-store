    <script>
      (() => {
        if (location.pathname !== "/" || location.hash || ["android", "ios"].includes("%MODE%") ||
            window.Capacitor?.isNativePlatform?.()) return;
        document.documentElement.dataset.homeBoot = String(performance.now());
        try {
          const seen = "gymdrobe.web-opening.seen.v1";
          if (!localStorage.getItem(seen)) {
            localStorage.setItem(seen, "1");
            document.documentElement.dataset.openingActive = "";
          }
        } catch {}
      })();
    </script>

      #gymdrobe-opening, #home-boot-shell { display: none; }
      html[data-home-boot] body { margin: 0; }
      html[data-home-boot] #app { visibility: hidden; }
      html[data-opening-active], html[data-opening-active] body {
        background: #0f3d3a; overflow: hidden; overscroll-behavior: none;
      }
      html[data-opening-active] #gymdrobe-opening {
        position: fixed; inset: 0; z-index: 2147483647; display: block; background: #0f3d3a;
      }
      #gymdrobe-opening > div {
        height: 100%; height: 100svh; box-sizing: border-box; display: grid; place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #gymdrobe-opening img { display: block; width: min(216px, 62vw); height: auto; }
      html[data-home-boot] #home-boot-shell {
        position: fixed; inset: 0; z-index: 2147483646; display: block;
        overflow-y: auto; background: #0f3d3a; font: 600 16px/1.4 system-ui, sans-serif;
      }
      #home-boot-shell header { display: grid; place-items: center; position: relative; grid-template-rows: 56px 48px; padding: env(safe-area-inset-top) 0 8px; background: white; color: #0f3d3a; }
      #home-boot-shell header img { width: clamp(112px, 12vw, 154px); height: auto; }
      #home-boot-shell [data-boot-search] {
        box-sizing: border-box; justify-self: stretch; position: relative; margin: 0 max(13px, env(safe-area-inset-right)) 0 max(13px, env(safe-area-inset-left));
        height: 48px; color: #43534c;
      }
      #home-boot-shell [data-boot-search] svg {
        position: absolute; left: 12px; top: 14px; width: 20px; height: 20px; pointer-events: none;
      }
      #home-boot-shell [data-boot-search] input {
        box-sizing: border-box; width: 100%; height: 100%; margin: 0; padding: 0 12px 0 44px;
        appearance: none; border: 1px solid #d7d8ce; border-radius: 10px; background: #f8f7f2;
        color: #171c1b; font: 400 16px/1.3 system-ui, sans-serif;
      }
      #home-boot-shell [data-boot-search] input:focus { outline: 2px solid #0f3d3a; outline-offset: -2px; }
      #home-boot-shell [data-boot-search] input::placeholder { color: #526057; opacity: 1; }
      #home-boot-shell [data-boot-reload] { position: absolute; top: calc(6px + env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); color: inherit; font-size: 13px; padding: 12px 2px; }
      #home-boot-shell [hidden] { display: none; }
      #home-boot-shell nav { display: grid; gap: 8px; padding: 8px 13px; margin: auto; max-width: 1440px; }
      #home-boot-shell nav a { display: grid; position: relative; aspect-ratio: 1; place-items: center; overflow: hidden; background: #174944; color: #171717; text-decoration: none; }
      #home-boot-shell nav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
      #home-boot-shell nav a:last-child img { object-position: center 44%; }
      #home-boot-shell nav span { position: relative; display: grid; place-items: center; box-sizing: border-box; min-height: 48px; padding: 10px 24px; background: white; }
      @media (max-width: 700px) { #home-boot-shell header img { width: 120px; } }
      @media (min-width: 1024px) {
        #home-boot-shell header { grid-template-rows: 64px; padding-bottom: 0; }
        #home-boot-shell [data-boot-search] { position: absolute; right: max(124px, calc((100% - 1600px) / 2 + 124px)); width: min(340px, calc(50% - 200px)); margin: 0; }
        #home-boot-shell [data-boot-reload] { right: auto; left: 12px; }
      }
      @media (min-width: 701px) { #home-boot-shell nav { grid-template-columns: repeat(2,minmax(0,1fr)); } }

  <body>
    <div id="gymdrobe-opening" aria-hidden="true"><div><img src="/brand/gymdrobe-wordmark-cream.png" alt="" width="720" height="134" /></div></div>
    <template id="home-boot-template">
      <div id="home-boot-shell">
        <header>
          <img src="/brand/gymdrobe-wordmark-green.png" alt="GymDrobe" width="720" height="134" />
          <form data-boot-search role="search" action="/shop" method="get">
            <input type="search" name="search" aria-label="Search products" placeholder="Search GymDrobe" enterkeyhint="search" autocomplete="off" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>
          </form>
          <a href="" data-boot-reload hidden>Reload storefront</a>
        </header>
        <nav aria-label="Shop by department">
          <a href="/shop?gender=Women"><img alt="" width="736" height="736" fetchpriority="high" src="/media/campaign/women-hoodie-736.webp?v=3" srcset="/media/campaign/women-hoodie-432.webp?v=3 432w, /media/campaign/women-hoodie-736.webp?v=3 736w" sizes="(max-width: 700px) calc(100vw - 26px), (max-width: 1466px) calc((100vw - 34px) / 2), 716px" /><span>Women’s</span></a>
          <a href="/shop?gender=Men"><img alt="" width="736" height="736" fetchpriority="auto" src="/media/campaign/men-hoodie-736.webp?v=3" srcset="/media/campaign/men-hoodie-432.webp?v=3 432w, /media/campaign/men-hoodie-736.webp?v=3 736w" sizes="(max-width: 700px) calc(100vw - 26px), (max-width: 1466px) calc((100vw - 34px) / 2), 716px" /><span>Men’s</span></a>
        </nav>
      </div>
    </template>
    <div id="app"></div>
    <script>
      (() => {
        const root = document.documentElement;
        const screen = document.getElementById("gymdrobe-opening");
        const template = document.getElementById("home-boot-template");
        if (!root.hasAttribute("data-home-boot")) {
          screen.remove();
          template.remove();
          return;
        }

        template.replaceWith(template.content);
        const shell = document.getElementById("home-boot-shell");
        const app = document.getElementById("app");
        const logo = screen.querySelector("img");
        let opening = root.hasAttribute("data-opening-active");
        let minimumMet = !opening;
        let expired = false;
        let minimumTimer;
        let visibleSince;
        let minimumLeft = 3000;
        let marked = false;
        let frame;
        app.inert = true;
        shell.inert = opening;
        if (!opening) screen.remove();

        function uncover() {
          if (!opening) return;
          opening = false;
          screen.remove();
          delete root.dataset.openingActive;
          shell.inert = false;
          performance.mark("gymdrobe-opening-dismissed");
        }

        function handoff() {
          const scrollTop = shell.scrollTop;
          const search = shell.querySelector('input[name="search"]');
          const focused = document.activeElement === search;
          uncover();
          observer.disconnect();
          clearTimeout(minimumTimer);
          clearTimeout(deadlineTimer);
          cancelAnimationFrame(frame);
          window.removeEventListener("pagehide", leave);
          window.removeEventListener("popstate", check);
          document.removeEventListener("visibilitychange", visible);
          delete root.dataset.homeBoot;
          app.inert = false;
          if ((focused || search.value) && location.pathname === "/") {
            window.dispatchEvent(new CustomEvent("gymdrobe:resume-search", { detail: {
              query: search.value, focused, selectionStart: search.selectionStart, selectionEnd: search.selectionEnd
            } }));
          }
          shell.remove();
          if (scrollTop && location.pathname === "/") window.scrollTo({ top: scrollTop, behavior: "instant" });
        }

        function check() {
          if (location.pathname !== "/" || location.hash) return handoff();
          if ((!minimumMet && !expired) || root.hasAttribute("data-style-pending") ||
              root.hasAttribute("data-home-style-error")) return;
          const tile = app.querySelector('a[data-home-lead][href="/shop?gender=Women"]');
          if (tile && tile.textContent.trim() && tile.getBoundingClientRect().width &&
              (!opening || tile.dataset.homePhoto === "ready")) {
            handoff();
          } else if (app.querySelector(".page-error")) {
            handoff();
          }
        }

        function leave() {
          // A restored history entry should resume shopping, even if the intro was interrupted.
          minimumMet = true;
          uncover();
          check();
        }

        function visible() {
          cancelAnimationFrame(frame);
          if (!opening || minimumMet) return;
          if (document.hidden) {
            if (visibleSince !== undefined) {
              minimumLeft = Math.max(0, minimumLeft - (performance.now() - visibleSince));
              visibleSince = undefined;
              clearTimeout(minimumTimer);
            }
            return;
          }
          if (visibleSince !== undefined) return;
          // The second frame follows a paint opportunity for the decoded inline wordmark.
          frame = requestAnimationFrame(() => {
            frame = requestAnimationFrame(() => {
              if (document.hidden || !opening) return;
              visibleSince = performance.now();
              if (!marked) {
                marked = true;
                performance.mark("gymdrobe-logo-visible");
              }
              minimumTimer = setTimeout(() => { minimumMet = true; check(); }, minimumLeft);
            });
          });
        }

        const observer = new MutationObserver(check);
        observer.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-home-photo"] });
        observer.observe(root, { attributes: true, attributeFilter: ["data-style-pending", "data-home-style-error"] });
        window.addEventListener("pagehide", leave);
        window.addEventListener("popstate", check);
        // Keep this independent of logo decode, paint scheduling, and the React bundle.
        const deadlineTimer = setTimeout(() => {
          expired = true;
          uncover();
          shell.querySelector("[data-boot-reload]").hidden = false;
          check();
        }, Math.max(0, 6000 - (performance.now() - Number(root.dataset.homeBoot))));

        if (opening) logo.decode().then(() => {
          if (!opening) return;
          document.addEventListener("visibilitychange", visible);
          visible();
        }).catch(() => {
          // The independent deadline still exposes the working shop links.
        });
        check();
      })();
    </script>
