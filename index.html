<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <script>
      // Start the homepage's first frame before the React bundle executes.
      // Other routes do not download campaign media until they need it.
      if (window.location.pathname === "/") {
        const poster = document.createElement("link");
        poster.rel = "preload";
        poster.as = "image";
        poster.type = "image/webp";
        poster.fetchPriority = "high";
        poster.href = window.matchMedia("(max-width: 700px)").matches
          ? "/media/campaign/hero-mobile.webp"
          : "/media/campaign/hero-desktop.webp";
        document.head.appendChild(poster);
      }
    </script>

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="description"
      content="Discover training clothing, gym shoes and workout essentials at GymDrobe. Everything you need for every workout."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="application-name"
      content="GymDrobe"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GymDrobe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>
      GymDrobe | Everything for Every Workout
    </title>

    <!-- Transparent metallic GD monogram, not the old black-background JPEG.
         Versioned URLs invalidate browser and pinned-tab icon caches. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <meta
      property="og:site_name"
      content="GymDrobe"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="GymDrobe | Everything for Every Workout"
    />

    <meta
      property="og:description"
      content="Discover training clothing, gym shoes and workout essentials at GymDrobe. Everything you need for every workout."
    />

    <meta
      property="og:url"
      content="https://www.gymdrobe.com/"
    />

    <meta
      property="og:image"
      content="https://www.gymdrobe.com/gymdrobe-share-v1.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://www.gymdrobe.com/gymdrobe-share-v1.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1942"
    />

    <meta
      property="og:image:height"
      content="809"
    />

    <meta
      property="og:image:alt"
      content="GymDrobe wordmark"
    />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="GymDrobe | Everything for Every Workout"
    />

    <meta
      name="twitter:description"
      content="Discover training clothing, gym shoes and workout essentials at GymDrobe. Everything you need for every workout."
    />

    <meta
      name="twitter:image"
      content="https://www.gymdrobe.com/gymdrobe-share-v1.png"
    />

    <meta
      name="twitter:image:alt"
      content="GymDrobe wordmark"
    />

    <script
      id="gymdrobe-site-schema"
      type="application/ld+json"
    >
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.gymdrobe.com/#website",
            "url": "https://www.gymdrobe.com/",
            "name": "GymDrobe",
            "alternateName": [
              "Gym Drobe",
              "gymdrobe.com"
            ],
            "publisher": {
              "@id": "https://www.gymdrobe.com/#organization"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://www.gymdrobe.com/#organization",
            "url": "https://www.gymdrobe.com/",
            "name": "GymDrobe",
            "alternateName": "Gym Drobe",
            "description": "GymDrobe brings products from different fitness brands and suppliers together in one shopping experience.",
            "slogan": "Everything You Need for Every Workout."
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
